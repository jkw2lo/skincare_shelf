<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=5">
<title>Shelf Life</title>
<meta name="theme-color" content="#EDEFE9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131714" media="(prefers-color-scheme: dark)">
<meta name="description" content="A visual skincare inventory: products on shelves that drain as you use them.">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Space+Mono:wght@400;700&display=swap">
<style>
:root{
  --bg:#EDEFE9; --surface:#F8F9F5; --sunk:#E3E6DE; --ink:#1A211C; --ink-2:#44524A; --muted:#6B7A70;
  --line:#D2D8CD; --line-2:#BFC7B9;
  --wood:#D9C9AC; --wood-2:#C4AE8A; --wood-edge:#A88F66; --wood-shadow:#00000014;
  --accent:#D8562B; --accent-ink:#FFF6F2; --accent-soft:#F6DED4; --indigo:#2C4A5E;
  --idle:#A9B3A8; --idle-soft:#CDD4CB;
  --good:#3F7D50; --warn:#B07C12; --crit:#A3372B;
  --good-bg:#E2EEE3; --warn-bg:#F5EBD4; --crit-bg:#F4DED9;
  --glass:#FFFFFFAA; --glass-line:#0000001F;
  --shadow:0 1px 2px #0000000F, 0 6px 16px -8px #0000002E;
  --lift:0 2px 6px -1px #00000022, 0 12px 28px -10px #00000033;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#131714; --surface:#1C2220; --sunk:#171C19; --ink:#E9EEE7; --ink-2:#BCC7BD; --muted:#8B9A90;
  --line:#2C3531; --line-2:#3C4740;
  --wood:#3E3526; --wood-2:#2E281C; --wood-edge:#544733; --wood-shadow:#00000055;
  --accent:#F07B4D; --accent-ink:#241009; --accent-soft:#3A2116; --indigo:#8FB4CC;
  --idle:#5C665C; --idle-soft:#39423A;
  --good:#6FB884; --warn:#D9AB4A; --crit:#E0705E;
  --good-bg:#1D2C22; --warn-bg:#2E2717; --crit-bg:#33201C;
  --glass:#FFFFFF12; --glass-line:#FFFFFF2B;
  --shadow:0 1px 2px #00000044, 0 8px 20px -10px #00000077;
  --lift:0 2px 6px -1px #00000055, 0 14px 30px -10px #00000088;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#131714; --surface:#1C2220; --sunk:#171C19; --ink:#E9EEE7; --ink-2:#BCC7BD; --muted:#8B9A90;
  --line:#2C3531; --line-2:#3C4740;
  --wood:#3E3526; --wood-2:#2E281C; --wood-edge:#544733; --wood-shadow:#00000055;
  --accent:#F07B4D; --accent-ink:#241009; --accent-soft:#3A2116; --indigo:#8FB4CC;
  --idle:#5C665C; --idle-soft:#39423A;
  --good:#6FB884; --warn:#D9AB4A; --crit:#E0705E;
  --good-bg:#1D2C22; --warn-bg:#2E2717; --crit-bg:#33201C;
  --glass:#FFFFFF12; --glass-line:#FFFFFF2B;
  --shadow:0 1px 2px #00000044, 0 8px 20px -10px #00000077;
  --lift:0 2px 6px -1px #00000055, 0 14px 30px -10px #00000088;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink); overflow:hidden;
  font-family:"Zen Kaku Gothic New",-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;
  font-size:14px; line-height:1.5; -webkit-text-size-adjust:100%;
  overscroll-behavior:none;
}
.mono{font-family:"Space Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:7px 13px;font-size:13px;
  font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:background .12s,border-color .12s}
.btn:hover{background:var(--sunk)}
.btn-hero{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:7px}
.btn-wide{width:100%}

/* ===== app shell ===== */
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
.top{flex:0 0 auto;background:var(--surface);border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top) + 8px) 12px 0}
.top-row{display:flex;align-items:center;gap:10px}
.sign{display:flex;align-items:baseline;gap:8px;margin-right:auto;min-width:0}
.sign h1{margin:0;font-size:17px;font-weight:900;letter-spacing:-.015em;line-height:1;white-space:nowrap}
.sign .jp{font-size:10px;color:var(--muted);letter-spacing:.2em;white-space:nowrap}
@media (max-width:520px){.sign .jp{display:none}}
.mini{display:flex;gap:9px;margin-left:auto;font-family:"Space Mono",monospace;font-size:10px;color:var(--muted);
  font-variant-numeric:tabular-nums;white-space:nowrap}
.mini b{color:var(--ink);font-size:12px}
.mini .on b{color:var(--accent)}
.icon{width:34px;height:34px;border-radius:9px;border:1px solid var(--line-2);background:var(--bg);
  display:inline-flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 auto}
.icon:hover{background:var(--sunk)}
.viewtabs{display:flex;gap:2px;margin-top:8px}
.viewtabs button{flex:1;padding:8px 4px 9px;font-size:12.5px;font-weight:700;color:var(--muted);
  border-bottom:2px solid transparent;transition:color .12s,border-color .12s}
.viewtabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.searchwrap{padding:8px 0 0}
.search{width:100%;background:var(--bg);border:1px solid var(--line-2);border-radius:9px;
  padding:8px 11px;font:inherit;font-size:13px;color:var(--ink)}

.pane{flex:1 1 auto;min-height:0;display:none;flex-direction:column}
.pane.on{display:flex}

/* ===== home: shelves above, trays below ===== */
/* rolodex of categories; one shelf below it gets all the room */
.rolodex{flex:0 0 auto;position:relative;height:62px;background:var(--surface);
  border-bottom:1px solid var(--line);perspective:560px;overflow:hidden;touch-action:none;cursor:grab;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 16%,#000 84%,transparent);
  mask-image:linear-gradient(90deg,transparent,#000 16%,#000 84%,transparent)}
.rolodex:active{cursor:grabbing}
.wheel{position:absolute;inset:0;transform-style:preserve-3d;
  transition:transform .44s cubic-bezier(.22,.86,.28,1)}
.wheel.free{transition:none}
.rcat{position:absolute;left:50%;top:50%;width:150px;height:38px;margin:-19px 0 0 -75px;
  display:flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap;
  border:1px solid var(--line-2);border-radius:10px;background:var(--bg);
  backface-visibility:hidden;transition:background .2s,border-color .2s,color .2s}
.rcat .rn{font-size:13px;font-weight:700}
.rcat .rc{font-family:"Space Mono",monospace;font-size:9.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.rcat .rdot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:0 0 auto}
.rcat.sel{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.rcat.sel .rc{color:var(--bg);opacity:.75}
.rolodex .edge{position:absolute;top:0;bottom:0;width:1px;background:var(--accent);opacity:.18;pointer-events:none}
.rolodex .edge.l{left:calc(50% - 76px)} .rolodex .edge.r{left:calc(50% + 76px)}

#stage{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:12px 10px 16px}
.stage-h{display:flex;align-items:baseline;gap:9px;padding:0 2px 9px}
.stage-h h2{margin:0;font-size:15px;font-weight:900}
.stage-h .sc{font-family:"Space Mono",monospace;font-size:10.5px;color:var(--muted)}
.shelfgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));column-gap:0;row-gap:10px;
  background-image:repeating-linear-gradient(180deg,
    transparent 0 104px, #FFFFFF2E 104px 105px, var(--wood) 105px 109px,
    var(--wood-2) 109px 114px, var(--wood-edge) 114px 116px, transparent 116px 160px)}

.item{position:relative;height:150px;display:flex;flex-direction:column;align-items:center;
  cursor:grab;touch-action:none;transition:transform .1s}
.item:active{cursor:grabbing}
.item.lifted{opacity:.28}
.item.armed{transform:scale(1.07)}
.item .bottlebox{flex:1 1 auto;min-height:0;width:100%;display:flex;align-items:flex-end;justify-content:center;padding:0 3px}
.item .glass{display:block;filter:drop-shadow(0 3px 4px var(--wood-shadow))}
.item .board{flex:0 0 auto;width:100%;height:12px}
.item .cap{flex:0 0 auto;height:36px;padding:4px 2px 0;display:flex;flex-direction:column;gap:1px;width:100%}
.item .cap-brand{font-family:"Space Mono",monospace;font-size:7.5px;line-height:9px;letter-spacing:.05em;
  text-transform:uppercase;color:var(--muted);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .cap-name{font-size:9.5px;line-height:1.16;text-align:center;color:var(--ink-2);word-break:break-word;hyphens:auto}
.cq{font-weight:700;color:var(--ink-2);font-variant-numeric:tabular-nums}
.qty{position:absolute;top:0;right:2px;z-index:2;font-family:"Space Mono",monospace;font-size:9px;font-weight:700;
  min-width:17px;height:16px;padding:0 4px;border-radius:9px;background:var(--sunk);color:var(--ink-2);
  border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.flag{position:absolute;bottom:50px;left:3px;z-index:2;font-family:"Space Mono",monospace;font-size:8px;font-weight:700;
  padding:1px 5px;border-radius:4px;letter-spacing:.03em}
.flag.low{background:var(--warn-bg);color:var(--warn)}
.flag.out{background:var(--crit-bg);color:var(--crit)}

/* ===== trays ===== */
.trays{flex:0 0 auto;border-top:1px solid var(--line);background:var(--surface);
  padding:9px 10px calc(env(safe-area-inset-bottom) + 9px);display:flex;gap:8px}
.tray{flex:1;min-width:0;border:1.5px dashed var(--line-2);border-radius:11px;background:var(--bg);
  padding:7px 8px 8px;transition:border-color .14s,background .14s;min-height:112px}
.tray.over{border-color:var(--accent);border-style:solid;background:var(--accent-soft)}
.tray-h{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.tray-h .t{font-family:"Space Mono",monospace;font-size:10px;font-weight:700;letter-spacing:.16em}
.tray-h .c{font-family:"Space Mono",monospace;font-size:9px;color:var(--muted);margin-left:auto}
.tray-items{display:flex;flex-wrap:wrap;gap:5px;align-content:flex-start}
.slotted{position:relative;width:46px;display:flex;flex-direction:column;align-items:center;gap:2px}
.slotted .st{font-family:"Space Mono",monospace;font-size:7px;text-transform:uppercase;letter-spacing:.04em;
  color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.slotted .bar{width:34px;height:3px;border-radius:2px;background:var(--line);overflow:hidden}
.slotted .bar i{display:block;height:100%}
.tray-empty{font-size:11px;color:var(--muted);font-style:italic;opacity:.75;padding:10px 2px}

/* ===== inventory (warehouse) ===== */
#invScroll{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:10px 10px calc(env(safe-area-inset-bottom) + 76px)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:7px}
.cell{position:relative;border:1px solid var(--line);border-radius:10px;background:var(--surface);
  padding:8px 5px 7px;display:flex;flex-direction:column;align-items:center;gap:0;text-align:center;
  transition:border-color .12s,transform .1s}
.cell:hover{border-color:var(--line-2)}
.cell.using{border-color:var(--accent);background:var(--accent-soft)}
.cell .cn{font-size:9.5px;line-height:1.18;color:var(--ink-2);margin-top:7px;word-break:break-word}
.cell .cb{font-family:"Space Mono",monospace;font-size:7.5px;letter-spacing:.05em;text-transform:uppercase;
  color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.invhead{display:flex;align-items:center;gap:8px;padding:2px 2px 10px}
.invhead .lab{font-family:"Space Mono",monospace;font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.invhead .rule{flex:1;height:1px;background:var(--line)}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{border:1px solid var(--line-2);border-radius:20px;padding:4px 11px;font-size:12px;background:var(--bg);transition:.12s}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}

/* ===== counter view ===== */
#cntScroll{flex:1 1 auto;min-height:0;overflow-y:auto;padding:10px 10px calc(env(safe-area-inset-bottom) + 76px)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:11px;box-shadow:var(--shadow);margin-bottom:10px}
.card-h{display:flex;align-items:center;gap:8px;padding:10px 13px;border-bottom:1px solid var(--line)}
.card-h h2{margin:0;font-size:13px;font-weight:900}
.card-h .sub{font-family:"Space Mono",monospace;font-size:10px;color:var(--muted);margin-left:auto;font-variant-numeric:tabular-nums}
.steps{display:flex;flex-direction:column}
.step{display:flex;align-items:center;gap:9px;padding:7px 11px;border-top:1px dashed var(--line);min-height:42px}
.step:first-child{border-top:none}
.step .sn{font-family:"Space Mono",monospace;font-size:9.5px;text-transform:uppercase;letter-spacing:.07em;
  color:var(--muted);width:72px;flex:0 0 auto}
.step .pn{flex:1;min-width:0;font-size:12px;line-height:1.25}
.step .pn i{font-style:normal;display:block;font-family:"Space Mono",monospace;font-size:8.5px;
  text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.step .none{flex:1;font-size:11px;color:var(--muted);font-style:italic;opacity:.7}
.meter{flex:0 0 40px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%}
.x{color:var(--muted);font-size:16px;line-height:1;padding:3px 6px;border-radius:5px}
.x:hover{background:var(--crit-bg);color:var(--crit)}
.q{display:flex;align-items:center;gap:9px;padding:8px 13px;width:100%;text-align:left;border-top:1px solid var(--line)}
.q:first-child{border-top:none}
.q .nm{flex:1;min-width:0;font-size:12px;line-height:1.3}
.q .nm i{font-style:normal;display:block;font-family:"Space Mono",monospace;font-size:9px;
  text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.q .why{font-family:"Space Mono",monospace;font-size:9.5px;color:var(--muted);text-align:right;flex:0 0 auto}
.q .why b{display:block;font-size:11px}
.q .why.warn b{color:var(--warn)} .q .why.crit b{color:var(--crit)} .q .why.good b{color:var(--good)}
.empty-note{padding:14px 13px;font-size:12px;color:var(--muted);text-align:center}

/* ===== peek overlay (tap a product) ===== */
.scrim{position:fixed;inset:0;background:#0A0D0B70;z-index:50;opacity:0;pointer-events:none;transition:opacity .16s}
.scrim.on{opacity:1;pointer-events:auto}
.peek{position:fixed;left:50%;top:50%;transform:translate(-50%,-46%) scale(.97);width:min(360px,calc(100vw - 28px));
  background:var(--surface);border:1px solid var(--line);border-radius:15px;box-shadow:var(--lift);z-index:52;
  opacity:0;pointer-events:none;transition:opacity .16s,transform .16s;overflow:hidden}
.peek.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.peek-top{display:flex;gap:12px;padding:14px 14px 12px}
.peek-top .tx{flex:1;min-width:0}
.peek-top .br{font-family:"Space Mono",monospace;font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.peek-top h3{margin:2px 0 0;font-size:15px;font-weight:700;line-height:1.25;text-wrap:balance}
.peek-top .cat{font-size:11px;color:var(--muted);margin-top:3px}
.peek-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.peek-stats div{background:var(--surface);padding:8px 6px;text-align:center}
.peek-stats dt{font-size:8.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0}
.peek-stats dd{margin:2px 0 0;font-family:"Space Mono",monospace;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.peek-stats dd.good{color:var(--good)} .peek-stats dd.warn{color:var(--warn)} .peek-stats dd.crit{color:var(--crit)}
.peek-act{padding:11px 12px 12px;display:flex;flex-direction:column;gap:7px}
.peek-act .row{display:flex;gap:7px}
.peek-act .row .btn{flex:1}
.btn-on{background:var(--accent);color:var(--accent-ink);border-color:transparent}

/* ===== full detail sheet ===== */
.sheet{position:fixed;inset:0;z-index:60;background:var(--surface);display:flex;flex-direction:column;
  transform:translateY(100%);transition:transform .22s cubic-bezier(.3,.8,.4,1)}
.sheet.on{transform:none}
.sheet-bar{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 9px) 10px 9px;
  border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0;z-index:2}
.back{display:inline-flex;align-items:center;gap:6px;padding:7px 11px 7px 8px;border-radius:9px;
  font-size:13px;font-weight:700;background:var(--sunk)}
.back:hover{background:var(--line)}
.sheet-bar .ttl{flex:1;min-width:0;font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-body{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 14px calc(env(safe-area-inset-bottom) + 30px)}
.sec{padding:14px 0;border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:none}
.sec>h4{margin:0 0 9px;font-family:"Space Mono",monospace;font-size:10px;font-weight:700;text-transform:uppercase;
  letter-spacing:.13em;color:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border:1px solid var(--line);
  border-radius:9px;overflow:hidden}
.facts div{background:var(--surface);padding:8px 10px}
.facts dt{font-size:9.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:0}
.facts dd{margin:1px 0 0;font-family:"Space Mono",monospace;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.facts dd small{font-size:10px;font-weight:400;color:var(--muted)}
.facts dd.good{color:var(--good)} .facts dd.warn{color:var(--warn)} .facts dd.crit{color:var(--crit)}
.level{display:flex;align-items:center;gap:12px}
.level input[type=range]{flex:1;accent-color:var(--accent);height:26px}
.level .pct{font-family:"Space Mono",monospace;font-size:15px;font-weight:700;width:46px;text-align:right}
.picker{display:flex;gap:6px;flex-wrap:wrap}
.dose{border:1px solid var(--line-2);border-radius:9px;padding:6px 5px 5px;width:66px;background:var(--bg);
  display:flex;flex-direction:column;align-items:center;gap:3px}
.dose[aria-pressed="true"]{border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 1px var(--accent)}
.dose .lab{font-size:9.5px;line-height:1.15;text-align:center;color:var(--ink-2)}
.dose .ml{font-family:"Space Mono",monospace;font-size:8.5px;color:var(--muted)}
.rowbtns{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.note{font-size:11.5px;color:var(--muted);line-height:1.45;margin:8px 0 0}
.ai{background:var(--warn-bg);border-left:3px solid var(--warn);border-radius:6px;padding:8px 10px;
  font-size:11.5px;line-height:1.45;margin-top:9px}
.ing{font-size:11px;line-height:1.55;color:var(--ink-2);max-height:120px;overflow-y:auto;background:var(--bg);
  border:1px solid var(--line);border-radius:7px;padding:8px 10px;word-break:break-word}
input[type=text],input[type=number],input[type=search],textarea,select{
  width:100%;background:var(--bg);border:1px solid var(--line-2);border-radius:8px;padding:8px 10px;
  font:inherit;font-size:14px;color:var(--ink)}
textarea{resize:vertical;min-height:54px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:9px}
.field label{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}

/* ===== scan fab + camera ===== */
.fab{position:fixed;right:14px;bottom:calc(env(safe-area-inset-bottom) + 14px);z-index:40;
  width:58px;height:58px;border-radius:50%;background:var(--accent);color:var(--accent-ink);
  box-shadow:0 3px 8px -1px #0000003D,0 10px 24px -6px #00000047;
  display:flex;align-items:center;justify-content:center;transition:transform .12s}
.fab:active{transform:scale(.93)}
.fab svg{width:25px;height:25px}
body.tray-mode .fab{transform:translateY(130%)}
.cam-wrap{position:relative}
.cam{width:100%;aspect-ratio:3/4;max-height:56vh;background:#0C0F0D;border-radius:10px;object-fit:cover;display:block}
.torch{position:absolute;right:10px;bottom:10px;width:40px;height:40px;border-radius:50%;
  background:#000000A8;color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center;opacity:.62}
.srcs{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line);
  border-radius:8px;overflow:hidden;margin:10px 0 2px}
.src{display:flex;align-items:center;gap:8px;background:var(--surface);padding:7px 10px;font-size:11.5px}
.src .dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
.src.on .dot{background:var(--good)} .src.off .dot{background:var(--line-2)}
.src.off .sname{color:var(--muted)}
.src .sname{flex:1;min-width:0;font-weight:700}
.src .snote{font-family:"Space Mono",monospace;font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.diag{margin-top:8px;padding:7px 9px;background:var(--sunk);border:1px solid var(--line);border-radius:7px;
  font-size:10px;line-height:1.5;color:var(--muted);word-break:break-word}
.reticle{position:absolute;left:8%;right:8%;top:38%;height:24%;border:2px dashed var(--accent);border-radius:6px;
  box-shadow:0 0 0 2000px #00000038}

.ghost{position:fixed;z-index:70;pointer-events:none;transform:translate(-50%,-62%) scale(1.14);
  filter:drop-shadow(0 12px 18px #0000005C)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 84px);transform:translate(-50%,12px);
  z-index:80;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13px;
  font-weight:500;box-shadow:var(--lift);opacity:0;pointer-events:none;transition:opacity .16s,transform .16s;
  max-width:88vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (min-width:860px){
  .trays{gap:12px;padding:12px 16px}
  .tray{min-height:132px}
  #shelfScroll,#invScroll,#cntScroll{padding-left:16px;padding-right:16px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:10px}
  .sheet{left:auto;width:min(460px,100%);border-left:1px solid var(--line);transform:translateX(100%)}
  .sheet.on{transform:none}
}

<script>
"use strict";

/* ===== vocabulary ===== */
const DOSES={
  drop1:{ml:.05,lab:"1 drop"}, rice:{ml:.07,lab:"rice grain"}, drop3:{ml:.15,lab:"3 drops"},
  pea:{ml:.25,lab:"pea"}, dots3:{ml:.35,lab:"3 dots"}, dots5:{ml:.6,lab:"5 dots"},
  pump2:{ml:.8,lab:"2 pumps"}, almond:{ml:.9,lab:"almond"}, coin:{ml:1.25,lab:"¼ tsp"},
  splash:{ml:1.5,lab:"a splash"}, palm:{ml:2.5,lab:"palmful"},
  sheet:{ml:1,lab:"1 sheet"}, none:{ml:0,lab:"untracked"}
};
const DOSE_ORDER=["drop1","rice","drop3","pea","dots3","dots5","pump2","almond","coin","splash","palm"];
// Steps in the order they go on the face. A tray holds at most one product per step.
const STEP_ORDER=["remover","cleanser","exfoliant","toner","treatment","serum","eye","moisturizer","mask","sunscreen"];
const STEPS={remover:"Remover",cleanser:"Cleanser",exfoliant:"Exfoliant",toner:"Toner",treatment:"Treatment",
  serum:"Serum",eye:"Eye",moisturizer:"Moisturizer",mask:"Mask",sunscreen:"Sunscreen"};
const CAT_STEP={Remover:"remover",Cleanser:"cleanser",Exfoliant:"exfoliant",Toner:"toner",Treatment:"treatment",
  Serum:"serum",Eye:"eye",Moisturizer:"moisturizer","Sheet Mask":"mask","Clay Mask":"mask",Sunscreen:"sunscreen"};
const TRAYS=[{id:"am",lab:"AM"},{id:"pm",lab:"PM"}];
const STEP_SHORT={remover:"Remove",cleanser:"Cleanse",exfoliant:"Exfol",toner:"Toner",treatment:"Treat",
  serum:"Serum",eye:"Eye",moisturizer:"Cream",mask:"Mask",sunscreen:"SPF"};
const SHELF_ORDER=["Cleanser","Remover","Toner","Treatment","Serum","Eye","Moisturizer","Sunscreen",
  "Exfoliant","Sheet Mask","Clay Mask","Hair","Makeup","Other"];
const CAT_DEFAULTS={
  Cleanser:{container:"tube",dose:"splash",pao:12}, Remover:{container:"bottle",dose:"palm",pao:12},
  Toner:{container:"tallbottle",dose:"splash",pao:6}, Treatment:{container:"bottle",dose:"splash",pao:6},
  Serum:{container:"dropper",dose:"drop3",pao:6}, Eye:{container:"smalljar",dose:"rice",pao:6},
  Moisturizer:{container:"jar",dose:"dots3",pao:6}, Sunscreen:{container:"tube",dose:"coin",pao:12},
  Exfoliant:{container:"tub",dose:"sheet",pao:6}, "Sheet Mask":{container:"pouch",dose:"sheet",pao:6},
  "Clay Mask":{container:"tub",dose:"palm",pao:12}, Hair:{container:"bottle",dose:"pump2",pao:12},
  Makeup:{container:"stick",dose:"none",pao:12}, Other:{container:"bottle",dose:"dots3",pao:12}
};
const SHAPES={
  tallbottle:{body:[24,30,52,128,5],parts:[[42,14,16,18,0],[37,2,26,14,3]]},
  bottle:{body:[22,46,56,112,6],parts:[[42,30,16,18,0],[36,14,28,18,3]]},
  dropper:{body:[28,52,44,106,5],parts:[[44,38,12,16,0],[34,6,32,34,8]]},
  pump:{body:[24,44,52,114,6],parts:[[44,28,12,18,0],[46,10,10,20,2],[28,10,26,9,3]]},
  tube:{body:[26,30,48,120,6],parts:[[22,147,56,11,2],[36,8,28,24,3]]},
  jar:{body:[14,70,72,88,8],parts:[[10,44,80,28,5]]},
  smalljar:{body:[26,96,48,62,6],parts:[[22,76,56,22,4]]},
  tub:{body:[12,62,76,96,9],parts:[[8,42,84,22,5]]},
  compact:{body:[10,104,80,54,10],parts:[[14,95,72,12,5]]},
  stick:{body:[38,56,24,102,4],parts:[[34,6,32,52,4]]},
  spray:{body:[26,48,48,110,6],parts:[[42,34,16,16,0],[30,14,40,22,4],[16,20,16,8,2]]},
  pouch:{body:[14,28,72,130,7],parts:[[12,17,76,12,3]]}
};

/* ===== time ===== */
const DAY=864e5;
const today=()=>new Date().toISOString().slice(0,10);
const parseD=s=>s?new Date(s+"T12:00:00Z").getTime():null;
const daysSince=s=>{const t=parseD(s);return t?Math.max(0,(Date.now()-t)/DAY):0;};
function addMonths(s,m){const d=new Date(parseD(s));d.setUTCMonth(d.getUTCMonth()+m);return d;}
const fmtDate=d=>d.toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"});
const plural=(n,w)=>n+" "+w+(Math.abs(n)===1?"":"s");
function humanDays(n){
  if(n==null||!isFinite(n))return "—";
  if(n<1)return "today";
  if(n<45)return plural(Math.round(n),"day");
  if(n<730)return Math.round(n/30.4)+" mo";
  return (n/365).toFixed(1)+" yr";
}
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ===== state ===== */
const STORE_KEY="shelflife.items", CFG_KEY="shelflife.cfg";
let ITEMS=[], CFG={rakutenId:"",workerUrl:""}, QUERY="", VIEW="home", openCat=null;
const byId=id=>ITEMS.find(p=>p.id===id);
const catOf=p=>p.category||"Other";
const stepOf=p=>CAT_STEP[catOf(p)]||null;
const inUse=p=>Array.isArray(p.trays)&&p.trays.length>0;

function migrate(p){
  if(!Array.isArray(p.trays)){
    // older records carried a single "zone:step" slot
    const z=typeof p.slot==="string"?p.slot.split(":")[0]:null;
    p.trays=z==="both"?["am","pm"]:z==="am"||z==="pm"?[z]:[];
  }
  delete p.slot; delete p.color;
  if(p.photo===undefined)p.photo=null;
  return p;
}
function loadCfg(){try{const r=localStorage.getItem(CFG_KEY);if(r)CFG=Object.assign(CFG,JSON.parse(r));}catch(e){}}
function saveCfg(){try{localStorage.setItem(CFG_KEY,JSON.stringify(CFG));}catch(e){}}
function boot(){
  loadCfg();
  try{const r=localStorage.getItem(STORE_KEY);if(r){const d=JSON.parse(r);if(d&&d.length)ITEMS=d;}}catch(e){}
  if(!ITEMS.length)ITEMS=JSON.parse(JSON.stringify(SEED.items));
  ITEMS.forEach(migrate);
  renderAll();
}
function save(){
  try{localStorage.setItem(STORE_KEY,JSON.stringify(ITEMS));}
  catch(e){toast("Couldn't save — this browser is blocking storage.");}
}
function mutate(fn){fn();save();renderAll();}

/* ===== derived ===== */
function usesPerDay(p){
  const n=(p.trays||[]).length;
  if(!n)return 0;
  const st=stepOf(p);
  if(st==="mask"||st==="exfoliant")return n*(3/7);   // masks and acids aren't daily
  return n;
}
function derive(p){
  const bySheet=!!p.sheets;
  const cap=bySheet?p.sheets:(p.volumeMl||0);
  const perUse=bySheet?1:(DOSES[p.dose]||DOSES.none).ml;
  const perDay=perUse*usesPerDay(p);
  let days=p.activeDays||0;
  if(p.activeSince)days+=daysSince(p.activeSince);
  const start=cap*(p.open?p.baseline:1);
  const used=p.open&&cap?Math.min(perDay*days,start):0;
  const left=Math.max(start-used,0);
  const frac=cap?left/cap:(p.open?(p.baseline||1):1);
  const daysLeft=(perDay>0&&cap)?left/perDay:null;
  let expiry=null,daysToExp=null;
  if(p.open&&p.openedAt&&p.paoMonths){
    expiry=addMonths(p.openedAt,p.paoMonths);
    daysToExp=(expiry.getTime()-Date.now())/DAY;
  }
  const empty=cap?left<=cap*.005:false;
  const state=empty?"out":frac<.12?"crit":frac<.35?"warn":"good";
  return {cap,left,frac,perDay,perUse,daysLeft,expiry,daysToExp,bySheet,empty,state,
    unit:bySheet?"sheets":"ml",using:inUse(p)};
}
const stateColor=s=>s==="good"?"var(--good)":s==="warn"?"var(--warn)":"var(--crit)";

/* ===== drawing — colour carries one thing only: in use or not ===== */
let uidN=0;
function monogram(b){const w=String(b||"").trim().split(/\s+/);
  return (w.length>1?w[0][0]+w[1][0]:String(b||"?").slice(0,2)).toUpperCase();}
function bottleSVG(p,d,px){
  const s=SHAPES[p.container]||SHAPES.bottle;
  const [bx,by,bw,bh,br]=s.body;
  const uid="g"+(++uidN);
  const hue=d.using?"var(--accent)":"var(--idle)";
  const tracked=d.cap>0;
  const fh=tracked?Math.max(0,Math.min(1,d.frac))*bh:bh;
  const ly=by+bh-fh;
  const caps=s.parts.map(a=>`<rect x="${a[0]}" y="${a[1]}" width="${a[2]}" height="${a[3]}" rx="${a[4]||0}" fill="${hue}"/>`).join("");
  const labY=by+bh*.40, labH=Math.min(30,bh*.34);
  const showLabel=bw>=30&&bh>=46&&px>=52;
  return `<svg class="glass" width="${(px*100/160).toFixed(1)}" height="${px}" viewBox="0 0 100 160" aria-hidden="true">
<defs><clipPath id="${uid}"><rect x="${bx}" y="${by}" width="${bw}" height="${bh}" rx="${br}"/></clipPath></defs>
${caps}
<rect x="${bx}" y="${by}" width="${bw}" height="${bh}" rx="${br}" fill="var(--glass)"/>
<rect x="${bx}" y="${ly}" width="${bw}" height="${fh}" fill="${hue}" opacity="${tracked?(d.using?.85:.5):.28}" clip-path="url(#${uid})"/>
${tracked&&d.frac>.02&&d.frac<.99?`<rect x="${bx}" y="${ly}" width="${bw}" height="1.6" fill="#FFFFFF" opacity=".5" clip-path="url(#${uid})"/>`:""}
${showLabel?`<rect x="${bx+3}" y="${labY}" width="${bw-6}" height="${labH}" rx="2" fill="var(--surface)" opacity=".93"/>
<text x="50" y="${labY+labH/2+3.4}" text-anchor="middle" font-family="Space Mono, monospace" font-size="${Math.min(13,bw*.34)}" font-weight="700" fill="${hue}">${esc(monogram(p.brand))}</text>`:""}
<rect x="${bx}" y="${by}" width="${bw}" height="${bh}" rx="${br}" fill="none" stroke="var(--glass-line)" stroke-width="1.4"/>
</svg>`;
}
function doseGlyph(key){
  const marks={drop1:[[22,15,2.6]],rice:[[22,15,2.2]],drop3:[[16,14,2.4],[22,17,2.4],[28,13,2.4]],
    pea:[[22,15,4.2]],dots3:[[14,15,3.4],[22,12,3.4],[30,16,3.4]],
    dots5:[[12,14,3.4],[20,11,3.4],[22,19,3.4],[30,13,3.4],[28,20,3.4]],
    pump2:[[17,15,4.6],[27,15,4.6]],almond:[[22,15,5.6]],coin:[[22,15,7.4]],
    splash:[[22,15,8.4]],palm:[[22,15,10.4]]}[key];
  let inner="";
  if(key==="sheet")inner=`<rect x="11" y="6" width="22" height="18" rx="2.5" fill="var(--accent)" opacity=".85"/><path d="M15 11h14M15 15h14M15 19h9" stroke="var(--surface)" stroke-width="1.2" stroke-linecap="round" fill="none"/>`;
  else if(!marks)inner=`<path d="M14 15h16" stroke="var(--muted)" stroke-width="2" stroke-linecap="round" fill="none"/>`;
  else if(key==="splash"||key==="palm")inner=marks.map(m=>`<ellipse cx="${m[0]}" cy="${m[1]}" rx="${m[2]}" ry="${(m[2]*.72).toFixed(1)}" fill="var(--accent)" opacity=".85"/>`).join("");
  else inner=marks.map(m=>`<circle cx="${m[0]}" cy="${m[1]}" r="${m[2]}" fill="var(--accent)" opacity=".85"/>`).join("");
  return `<svg width="44" height="30" viewBox="0 0 44 30" aria-hidden="true"><rect x="2" y="2" width="40" height="26" rx="12" fill="var(--sunk)"/>${inner}</svg>`;
}

/* ===== home: accordion shelves ===== */
function bottleH(p,d){
  if(d.bySheet)return 52+22*Math.sqrt(Math.min(p.sheets,80)/80);
  if(!p.volumeMl)return 60;
  return 46+38*Math.sqrt(Math.min(p.volumeMl,200)/200);
}
function itemHTML(p){
  const d=derive(p);
  const units=p.sealed+(p.open?1:0);
  let flag="";
  if(d.empty&&p.open)flag='<span class="flag out">EMPTY</span>';
  else if(p.open&&d.state==="crit")flag='<span class="flag low">LOW</span>';
  return `<div class="item" data-id="${p.id}" role="button" tabindex="0" aria-label="${esc(p.brand+" "+p.name)}">
    ${flag}
    <span class="bottlebox">${bottleSVG(p,d,bottleH(p,d))}</span>
    <span class="board"></span>
    <span class="cap"><span class="cap-brand">${esc(p.brand)}${units>1?` <b class="cq">×${units}</b>`:""}</span>
    <span class="cap-name">${esc(p.name)}</span></span></div>`;
}
function groupItems(){
  const q=QUERY.trim().toLowerCase();
  const pool=q?ITEMS.filter(p=>(p.brand+" "+p.name+" "+catOf(p)).toLowerCase().includes(q)):ITEMS;
  const g={};
  pool.forEach(p=>{(g[catOf(p)]=g[catOf(p)]||[]).push(p);});
  const cats=Object.keys(g).sort((a,b)=>{
    const ia=SHELF_ORDER.indexOf(a),ib=SHELF_ORDER.indexOf(b);
    return (ia<0?99:ia)-(ib<0?99:ib)||a.localeCompare(b);
  });
  return {g,cats,total:pool.length};
}
/* The wheel is a cylinder: card i sits at rotateY(i*STEP) translateZ(R),
   and spinning the container brings the chosen one to face you. */
const CARD_W=150;
let WHEEL_STEP=30, WHEEL_R=280, wheelClosed=false;
let wheelCats=[], wheelKey="", wheelAngle=0;
function sizeWheel(n){
  // With enough categories the cylinder closes and the wheel turns forever.
  WHEEL_STEP=Math.min(30,360/Math.max(n,1));
  wheelClosed=n>=4&&Math.abs(n*WHEEL_STEP-360)<0.5;
  WHEEL_R=Math.round((CARD_W/2)/Math.tan(WHEEL_STEP*Math.PI/360));
}
// shortest signed distance between two angles on the cylinder
const angDelta=(a,b)=>wheelClosed?((a-b+540)%360)-180:a-b;

function buildWheel(cats,g){
  const key=cats.join("|");
  const wheel=document.getElementById("wheel");
  if(key!==wheelKey){
    wheelKey=key;wheelCats=cats;sizeWheel(cats.length);
    wheel.innerHTML=cats.map((c,i)=>{
      const using=g[c].filter(inUse).length;
      return `<button class="rcat" role="tab" data-cat="${esc(c)}" data-i="${i}"
        style="transform:rotateY(${i*WHEEL_STEP}deg) translateZ(${WHEEL_R}px)">
        ${using?'<span class="rdot"></span>':""}
        <span class="rn">${esc(c)}</span><span class="rc">${g[c].length}</span></button>`;
    }).join("");
  }else{
    // counts and in-use dots can change without the category set changing
    cats.forEach((c,i)=>{
      const el=wheel.children[i];if(!el)return;
      const using=g[c].filter(inUse).length;
      const dot=el.querySelector(".rdot");
      if(using&&!dot)el.insertAdjacentHTML("afterbegin",'<span class="rdot"></span>');
      else if(!using&&dot)dot.remove();
      el.querySelector(".rc").textContent=g[c].length;
    });
  }
  spinTo(Math.max(0,cats.indexOf(openCat)),true);
}
function applyAngle(deg){
  const wheel=document.getElementById("wheel");
  wheel.style.transform=`translateZ(${-WHEEL_R}px) rotateY(${-deg}deg)`;
  const fade=Math.max(60,WHEEL_STEP*3.4);
  [...wheel.children].forEach((el,i)=>{
    const off=Math.abs(angDelta(i*WHEEL_STEP,deg));
    const on=off<WHEEL_STEP/2;
    el.classList.toggle("sel",on);
    el.style.opacity=String(Math.max(0,1-off/fade));
    el.setAttribute("aria-selected",on?"true":"false");
  });
}
const idxFromAngle=d=>{
  const n=wheelCats.length||1;
  return wheelClosed?((Math.round(d/WHEEL_STEP)%n)+n)%n
                    :Math.max(0,Math.min(n-1,Math.round(d/WHEEL_STEP)));
};
function spinTo(idx,snap){
  const n=wheelCats.length||1;
  idx=wheelClosed?((idx%n)+n)%n:Math.max(0,Math.min(n-1,idx));
  // turn whichever way is shorter rather than unwinding the whole cylinder
  let target=idx*WHEEL_STEP;
  if(wheelClosed)target=wheelAngle+angDelta(target,wheelAngle);
  wheelAngle=target;
  const wheel=document.getElementById("wheel");
  wheel.classList.toggle("free",!snap);
  applyAngle(wheelAngle);
  const c=wheelCats[idx];
  if(c&&c!==openCat){openCat=c;renderStage();}
}
function renderShelves(){
  const {g,cats,total}=groupItems();
  const stage=document.getElementById("stage");
  if(!total){
    document.getElementById("wheel").innerHTML="";wheelKey="";
    stage.innerHTML=`<p class="empty-note">Nothing matches “${esc(QUERY)}”.</p>`;
    return;
  }
  if(!cats.includes(openCat))openCat=cats[0];
  buildWheel(cats,g);
  renderStage();
}
function renderStage(){
  const {g}=groupItems();
  const stage=document.getElementById("stage");
  if(!g[openCat]){stage.innerHTML="";return;}
  const list=g[openCat].slice().sort((a,b)=>{
    const da=derive(a),db=derive(b);
    return (db.using-da.using)||(b.open-a.open)||(da.frac-db.frac);
  });
  const units=g[openCat].reduce((n,p)=>n+p.sealed+(p.open?1:0),0);
  const using=g[openCat].filter(inUse).length;
  stage.innerHTML=`<div class="stage-h"><h2>${esc(openCat)}</h2>
      <span class="sc">${list.length} products · ${units} units${using?" · "+using+" in use":""}</span></div>
    <div class="shelfgrid">${list.map(itemHTML).join("")}</div>`;
  stage.scrollTop=0;
}
/* ===== home: AM / PM trays ===== */
function trayHTML(t){
  const on=ITEMS.filter(p=>(p.trays||[]).includes(t.id))
    .sort((a,b)=>STEP_ORDER.indexOf(stepOf(a))-STEP_ORDER.indexOf(stepOf(b)));
  const ml=on.reduce((s,p)=>{const d=derive(p);return s+(d.bySheet?0:d.perUse);},0);
  return `<div class="tray" data-tray="${t.id}">
    <div class="tray-h"><span class="t">${t.lab}</span>
      <span class="c">${on.length?on.length+" steps · "+ml.toFixed(1)+" ml":""}</span></div>
    ${on.length?`<div class="tray-items">${on.map(p=>{
      const d=derive(p);
      return `<button class="slotted" data-id="${p.id}" title="${esc(p.brand+" "+p.name)}">
        ${bottleSVG(p,d,34)}
        <span class="bar"><i style="width:${Math.max(4,d.frac*100)}%;background:${stateColor(d.state)}"></i></span>
        <span class="st">${esc(STEP_SHORT[stepOf(p)]||"")}</span></button>`;}).join("")}</div>`
    :`<p class="tray-empty">Drag a product here.</p>`}</div>`;
}
function renderTrays(){document.getElementById("trays").innerHTML=TRAYS.map(trayHTML).join("");}

/* ===== tray assignment: the step is worked out, never chosen ===== */
function assignToTray(p,trayId){
  const st=stepOf(p);
  if(!st){toast(catOf(p)+" isn't part of a face routine.");return false;}
  if(st==="sunscreen"&&trayId==="pm"){toast("Sunscreen at night would be a waste.");return false;}
  const prev=ITEMS.find(x=>x!==p&&(x.trays||[]).includes(trayId)&&stepOf(x)===st);
  if(prev)removeFromTray(prev,trayId);
  if(!p.open){if(p.sealed>0)p.sealed--;p.open=true;p.baseline=1;p.openedAt=p.openedAt||today();}
  if(p.dose==="none")p.dose=p.sheets?"sheet":(CAT_DEFAULTS[catOf(p)]||CAT_DEFAULTS.Other).dose;
  p.trays=Array.from(new Set([...(p.trays||[]),trayId]));
  if(!p.activeSince)p.activeSince=today();
  return prev||true;
}
function removeFromTray(p,trayId){
  p.trays=(p.trays||[]).filter(t=>t!==trayId);
  if(!p.trays.length&&p.activeSince){p.activeDays=(p.activeDays||0)+daysSince(p.activeSince);p.activeSince=null;}
}
function clearTrays(p){TRAYS.forEach(t=>removeFromTray(p,t.id));}
function rebaseline(p,frac){
  p.baseline=Math.max(0,Math.min(1,frac));p.activeDays=0;
  if(inUse(p))p.activeSince=today();
}

/* ===== inventory (warehouse) ===== */
let invFilter="all";
function renderInv(){
  const q=QUERY.trim().toLowerCase();
  let pool=q?ITEMS.filter(p=>(p.brand+" "+p.name+" "+catOf(p)).toLowerCase().includes(q)):ITEMS.slice();
  if(invFilter==="using")pool=pool.filter(inUse);
  else if(invFilter==="open")pool=pool.filter(p=>p.open&&!derive(p).empty);
  else if(invFilter==="sealed")pool=pool.filter(p=>p.sealed>0);
  else if(invFilter==="low")pool=pool.filter(p=>{const d=derive(p);return p.open&&(d.state==="crit"||d.empty);});
  pool.sort((a,b)=>{
    const ia=SHELF_ORDER.indexOf(catOf(a)),ib=SHELF_ORDER.indexOf(catOf(b));
    return (ia<0?99:ia)-(ib<0?99:ib)||a.brand.localeCompare(b.brand)||a.name.localeCompare(b.name);
  });
  const counts={all:ITEMS.length,using:ITEMS.filter(inUse).length,
    open:ITEMS.filter(p=>p.open&&!derive(p).empty).length,
    sealed:ITEMS.filter(p=>p.sealed>0).length,
    low:ITEMS.filter(p=>{const d=derive(p);return p.open&&(d.state==="crit"||d.empty);}).length};
  const chips=[["all","Everything"],["using","In use"],["open","Opened"],["sealed","Sealed"],["low","Running out"]]
    .map(([k,l])=>`<button class="chip" data-filter="${k}" aria-pressed="${invFilter===k}">${l} ${counts[k]}</button>`).join("");
  const cells=pool.map(p=>{
    const d=derive(p);
    const units=p.sealed+(p.open?1:0);
    return `<button class="cell${d.using?" using":""}" data-id="${p.id}">
      ${units>1?`<span class="qty">×${units}</span>`:""}
      ${bottleSVG(p,d,54)}
      <span class="cn">${esc(p.name)}</span><span class="cb">${esc(p.brand)}</span></button>`;}).join("");
  document.getElementById("invScroll").innerHTML=
    `<div class="chips" style="margin-bottom:10px">${chips}</div>
     <div class="invhead"><span class="lab">${pool.length} shown</span><span class="rule"></span></div>
     ${pool.length?`<div class="grid">${cells}</div>`:'<p class="empty-note">Nothing here.</p>'}`;
}

/* ===== counter view ===== */
function renderCounter(){
  const zones=TRAYS.map(t=>{
    const rows=STEP_ORDER.filter(st=>!(t.id==="pm"&&st==="sunscreen")).map(st=>{
      const p=ITEMS.find(x=>(x.trays||[]).includes(t.id)&&stepOf(x)===st);
      if(!p)return `<div class="step"><span class="sn">${STEPS[st]}</span><span class="none">empty</span></div>`;
      const d=derive(p);
      return `<div class="step"><span class="sn">${STEPS[st]}</span>
        <button class="pn" data-id="${p.id}" style="text-align:left">${esc(p.name)}<i>${esc(p.brand)}</i></button>
        <span class="meter"><i style="width:${Math.max(4,d.frac*100)}%;background:${stateColor(d.state)}"></i></span>
        <button class="x" data-off="${p.id}:${t.id}" aria-label="Remove">×</button></div>`;
    }).join("");
    const on=ITEMS.filter(p=>(p.trays||[]).includes(t.id));
    const ml=on.reduce((s,p)=>{const d=derive(p);return s+(d.bySheet?0:d.perUse);},0);
    return `<section class="card"><div class="card-h"><h2>${t.lab}</h2>
      <span class="sub">${on.length} steps · ${ml.toFixed(1)} ml a time</span></div>
      <div class="steps">${rows}</div></section>`;
  }).join("");

  const openCats={};
  ITEMS.forEach(p=>{if(p.open&&derive(p).frac>.12)openCats[catOf(p)]=true;});
  const next=ITEMS.filter(p=>p.sealed>0).map(p=>{
    const d=derive(p);let score=p.sealed,why="spare",cls="";
    if(p.open&&d.empty){score+=5;why="current one is empty";cls="crit";}
    else if(p.open&&d.frac<=.12){score+=4;why="current one is nearly out";cls="warn";}
    else if(!openCats[catOf(p)]){score+=3;why="nothing open in "+catOf(p).toLowerCase();cls="good";}
    else if(p.sealed>=3){score+=2;why="deep backstock";}
    return {p,score,why,cls};
  }).sort((a,b)=>b.score-a.score).slice(0,6);
  const fin=ITEMS.filter(p=>p.open).map(p=>{
    const d=derive(p);
    if(d.empty)return {p,d,score:100,txt:"empty",cls:"crit"};
    if(d.daysToExp!=null&&d.daysToExp<90)
      return {p,d,score:60-d.daysToExp/3,txt:d.daysToExp<0?"past PAO":"PAO in "+humanDays(d.daysToExp),cls:d.daysToExp<30?"crit":"warn"};
    if(d.frac<.25)return {p,d,score:40-d.frac*100,txt:Math.round(d.frac*100)+"% left",cls:"warn"};
    return null;
  }).filter(Boolean).sort((a,b)=>b.score-a.score).slice(0,6);

  const burn=ITEMS.reduce((s,p)=>{const d=derive(p);return s+(d.bySheet?0:d.perDay);},0);
  const sealedMl=ITEMS.reduce((s,p)=>s+p.sealed*(p.volumeMl||0),0);
  const months=burn>0?sealedMl/burn/30.4:null;

  document.getElementById("cntScroll").innerHTML=zones+
    `<section class="card"><div class="card-h"><h2>Open next</h2>
      <span class="sub">${ITEMS.reduce((n,p)=>n+p.sealed,0)} sealed${months?" · "+months.toFixed(0)+" mo supply":""}</span></div>
      ${next.length?next.map(o=>`<button class="q" data-id="${o.p.id}">
        <span class="nm">${esc(o.p.name)}<i>${esc(o.p.brand)}</i></span>
        <span class="why ${o.cls}"><b>${o.p.sealed} sealed</b>${esc(o.why)}</span></button>`).join("")
       :'<p class="empty-note">No sealed backstock left.</p>'}</section>
     <section class="card"><div class="card-h"><h2>Finish these</h2><span class="sub">low or expiring</span></div>
      ${fin.length?fin.map(o=>`<button class="q" data-id="${o.p.id}">
        <span class="nm">${esc(o.p.name)}<i>${esc(o.p.brand)}</i></span>
        <span class="why ${o.cls}"><b>${esc(o.txt)}</b>${o.d.daysLeft!=null?"~"+humanDays(o.d.daysLeft)+" left":"not in use"}</span></button>`).join("")
       :'<p class="empty-note">Nothing urgent.</p>'}</section>`;
}

function renderMini(){
  const units=ITEMS.reduce((n,p)=>n+p.sealed+(p.open?1:0),0);
  const using=ITEMS.filter(inUse).length;
  document.getElementById("mini").innerHTML=
    `<span><b>${ITEMS.length}</b> items</span><span><b>${units}</b> units</span><span class="on"><b>${using}</b> in use</span>`;
}
function renderAll(){
  renderMini();
  if(VIEW==="home"){renderShelves();renderTrays();}
  else if(VIEW==="inv")renderInv();
  else renderCounter();
  if(peekId)openPeek(peekId,true);
  if(sheetId)openSheet(sheetId,true);
}

/* ===== overlays. Android's back button closes them, one layer at a time. ===== */
const scrimEl=document.getElementById("scrim"), peekEl=document.getElementById("peek"),
      sheetEl=document.getElementById("sheet"), toastEl=document.getElementById("toast");
let peekId=null, sheetId=null, navDepth=0;
let toastT; function toast(m){toastEl.textContent=m;toastEl.classList.add("on");
  clearTimeout(toastT);toastT=setTimeout(()=>toastEl.classList.remove("on"),2500);}

function pushNav(){navDepth++;try{history.pushState({sl:navDepth},"");}catch(e){}}
window.addEventListener("popstate",()=>{
  if(navDepth>0)navDepth--;
  if(sheetId)closeSheet(true); else if(peekId)closePeek(true);
});
function syncScrim(){scrimEl.classList.toggle("on",!!(peekId||sheetId));}

function openPeek(id,keep){
  const p=byId(id);if(!p)return;
  const d=derive(p);
  if(!keep&&!peekId&&!sheetId)pushNav();
  peekId=id;
  const units=p.sealed+(p.open?1:0);
  const amOn=(p.trays||[]).includes("am"), pmOn=(p.trays||[]).includes("pm");
  const st=stepOf(p);
  peekEl.innerHTML=`
    <div class="peek-top">${bottleSVG(p,d,66)}
      <div class="tx"><div class="br">${esc(p.brand)}</div><h3>${esc(p.name)}</h3>
        <div class="cat">${esc(catOf(p))}${st&&STEPS[st]!==catOf(p)?" · "+STEPS[st]+" step":""}${p.volumeMl?" · "+p.volumeMl+" ml":p.sheets?" · "+p.sheets+" sheets":""}</div></div></div>
    <dl class="peek-stats">
      <div><dt>Left</dt><dd class="${d.state==="out"?"crit":d.state}">${d.cap?Math.round(d.frac*100)+"%":"—"}</dd></div>
      <div><dt>Runs out</dt><dd>${d.daysLeft!=null?humanDays(d.daysLeft):"—"}</dd></div>
      <div><dt>Units</dt><dd>${units}</dd></div></dl>
    <div class="peek-act">
      ${st?`<div class="row">
        <button class="btn ${amOn?"btn-on":""}" data-tray="am">${amOn?"✓ AM":"AM"}</button>
        ${st==="sunscreen"?"":`<button class="btn ${pmOn?"btn-on":""}" data-tray="pm">${pmOn?"✓ PM":"PM"}</button>`}</div>`
       :`<p class="note" style="margin:0">${esc(catOf(p))} isn't part of a face routine — it's tracked by shelf life.</p>`}
      <button class="btn btn-wide" data-more="1">More details</button>
    </div>`;
  peekEl.classList.add("on");peekEl.setAttribute("aria-hidden","false");syncScrim();
}
function closePeek(fromNav){
  peekId=null;peekEl.classList.remove("on");peekEl.setAttribute("aria-hidden","true");syncScrim();
  if(!fromNav&&navDepth>0){navDepth--;try{history.back();}catch(e){}}
}
function closeSheet(fromNav){
  sheetId=null;sheetEl.classList.remove("on");sheetEl.setAttribute("aria-hidden","true");syncScrim();
  if(!fromNav&&navDepth>0){navDepth--;try{history.back();}catch(e){}}
}

function openSheet(id,keep){
  const p=byId(id);if(!p)return;
  const d=derive(p);
  const sc=keep?(sheetEl.querySelector(".sheet-body")||{}).scrollTop||0:0;
  if(!keep&&!sheetId&&!peekId)pushNav();   // opened from a peek: reuse its history entry
  sheetId=id;
  if(peekId){peekId=null;peekEl.classList.remove("on");peekEl.setAttribute("aria-hidden","true");}
  const pct=Math.round(d.frac*100);
  const st=stepOf(p);
  const lvl=d.cap
    ?`<div><dt>Left</dt><dd class="${d.state==="out"?"crit":d.state}">${d.left.toFixed(d.bySheet?0:1)}<small> / ${d.cap} ${d.unit}</small></dd></div>
      <div><dt>Runs out</dt><dd>${d.daysLeft!=null?humanDays(d.daysLeft):"—"}</dd></div>`
    :`<div><dt>Left</dt><dd>—<small> no size on file</small></dd></div><div><dt>Runs out</dt><dd>—</dd></div>`;
  sheetEl.innerHTML=`
  <div class="sheet-bar"><button class="back" id="backBtn">‹ Back</button>
    <span class="ttl">${esc(p.name)}</span></div>
  <div class="sheet-body">
    <div class="sec" style="display:flex;gap:13px;align-items:flex-start;border-bottom:1px solid var(--line)">

        <div style="font-size:11.5px;color:var(--muted);margin-top:3px">${esc(catOf(p))}${p.volumeMl?" · "+p.volumeMl+" ml":p.sheets?" · "+p.sheets+" sheets":""}</div>
      </div></div>

    <div class="sec"><h4>Routine</h4>
      ${st?`<div class="chips">
        ${TRAYS.filter(t=>!(t.id==="pm"&&st==="sunscreen")).map(t=>
          `<button class="chip" data-tray="${t.id}" aria-pressed="${(p.trays||[]).includes(t.id)}">${t.lab}</button>`).join("")}
        <button class="chip" data-tray="" aria-pressed="${!inUse(p)}">Off</button></div>
        <p class="note">Goes into the <b>${STEPS[st]}</b> step automatically. ${d.perDay>0?`Using ${d.perDay.toFixed(2)} ${d.unit} a day.`:""}</p>`
       :`<p class="note">${esc(catOf(p))} isn't part of a face routine.</p>`}</div>

    <div class="sec"><h4>Stock</h4>
      <dl class="facts">${lvl}

          d.expiry?fmtDate(d.expiry):`<small>${p.open?"set an opened date":(p.paoMonths||12)+"M once opened"}</small>`}</dd></div></dl>
      <div class="rowbtns">
        ${p.sealed>0?`<button class="btn btn-sm" data-act="openone">Open a sealed one</button>`:""}

/* ===== two ways to put a product on a tray =====
   Tap  -> quick card with AM / PM buttons.
   Drag -> press and hold, then drag. A hold is unambiguous on touch, where a
   vertical swipe would otherwise be the browser scrolling the shelf away. */
let dragging=null,ghost=null,startPt=null,pending=null,lastDrag=0,holdTimer=null,lastScroll=0;
const HOLD_MS=260, MOVE_TOL=11;

function armDrag(){
  if(!pending)return;
  const p=byId(pending.id);
  if(!p||!stepOf(p)){pending=null;return;}
  dragging=p;
  pending.el.classList.remove("armed");
  pending.el.classList.add("lifted");
  document.body.classList.add("tray-mode");
  ghost=document.createElement("div");
  ghost.className="ghost";
  ghost.innerHTML=bottleSVG(p,derive(p),78);
  ghost.style.left=startPt.x+"px";ghost.style.top=startPt.y+"px";
  document.body.appendChild(ghost);
  if(navigator.vibrate)try{navigator.vibrate(16);}catch(e){}
}
function cancelPending(){
  clearTimeout(holdTimer);holdTimer=null;
  if(pending)pending.el.classList.remove("armed");
  pending=null;
}
// keep the pending reference alive for the scroll, just disarm the hold
function cancelPending2(){
  clearTimeout(holdTimer);holdTimer=null;
  if(pending)pending.el.classList.remove("armed");
}
/* Bottles set touch-action:none so the browser can't steal the gesture
   mid-drag. That also means it no longer scrolls the shelf for us, so we
   do it by hand, with a flick that carries. */
const stageEl=document.getElementById("stage");
let scrolling=false, lastY=0, scrollVel=0, glideId=0;
function glide(){
  cancelAnimationFrame(glideId);
  const step=()=>{
    if(Math.abs(scrollVel)<0.4)return;
    stageEl.scrollTop-=scrollVel;
    scrollVel*=0.94;
    glideId=requestAnimationFrame(step);
  };
  glideId=requestAnimationFrame(step);
}
stageEl.addEventListener("pointerdown",e=>{
  const it=e.target.closest(".item");
  if(!it||e.button)return;
  cancelAnimationFrame(glideId);scrollVel=0;
  pending={id:it.dataset.id,el:it};
  startPt={x:e.clientX,y:e.clientY};
  lastY=e.clientY;scrolling=false;
  it.classList.add("armed");
  it.setPointerCapture&&it.setPointerCapture(e.pointerId);
  clearTimeout(holdTimer);
  // a mouse can drag straight away; touch waits for the hold
  holdTimer=setTimeout(armDrag, e.pointerType==="mouse"?0:HOLD_MS);
});
window.addEventListener("pointermove",e=>{
  if(pending&&!dragging){
    const dy=e.clientY-lastY;
    if(scrolling||Math.hypot(e.clientX-startPt.x,e.clientY-startPt.y)>MOVE_TOL){
      // moved before the hold completed: scroll the shelf ourselves
      if(!scrolling){scrolling=true;cancelPending2();}
      stageEl.scrollTop-=dy;
      scrollVel=dy;
      lastY=e.clientY;
    }
    return;
  }
  if(!dragging)return;
  e.preventDefault();
  ghost.style.left=e.clientX+"px";ghost.style.top=e.clientY+"px";
  document.querySelectorAll(".tray.over").forEach(t=>t.classList.remove("over"));
  const el=document.elementFromPoint(e.clientX,e.clientY);
  const tray=el&&el.closest(".tray");
  if(tray&&!(tray.dataset.tray==="pm"&&stepOf(dragging)==="sunscreen"))tray.classList.add("over");
},{passive:false});
window.addEventListener("pointercancel",()=>{cancelPending();finishDrag(null);});
window.addEventListener("pointerup",e=>{
  const wasScrolling=scrolling;
  cancelPending();
  if(wasScrolling){scrolling=false;lastScroll=Date.now();glide();return;}
  if(!dragging)return;
  const el=document.elementFromPoint(e.clientX,e.clientY);
  const tray=el&&el.closest(".tray");
  finishDrag(tray&&tray.classList.contains("over")?tray:document.querySelector(".tray.over"));
});
function finishDrag(target){
  if(!dragging)return;
  const p=dragging;
  if(ghost){ghost.remove();ghost=null;}
  document.body.classList.remove("tray-mode");
  document.querySelectorAll(".tray.over").forEach(t=>t.classList.remove("over"));
  dragging=null;lastDrag=Date.now();
  if(!target)return renderAll();
  const tray=target.dataset.tray;
  let replaced=null;
  mutate(()=>{replaced=assignToTray(p,tray);});
  if(replaced&&replaced!==true)toast(p.name+" replaced "+replaced.name+" in "+tray.toUpperCase());
  else if(replaced)toast(p.name+" → "+tray.toUpperCase()+" "+STEPS[stepOf(p)].toLowerCase());
}

/* ===== lookup: the Worker if it's configured, else straight to the open databases ===== */
function parseJpSize(t){
  const m=String(t||"").match(/(\d+(?:[.,]\d+)?)\s*(ml|mL|ML|ｍｌ|g|ｇ|グラム|ミリ)/);
  if(!m)return null;
  const v=parseFloat(m[1].replace(",","."));
  return (v>0&&v<=2000)?v:null;
}
let lastTrace=null;
async function viaWorker(code){
  if(!CFG.workerUrl){lastTrace={worker:"not configured"};return null;}
  const base=CFG.workerUrl.replace(/\/+$/,"");
  let r;
  try{r=await fetch(base+"/lookup?code="+encodeURIComponent(code));}
  catch(e){lastTrace={worker:"unreachable — wrong URL, or this origin isn't in ALLOWED_ORIGINS"};return null;}
  if(!r.ok){lastTrace={worker:"HTTP "+r.status};return null;}
  const d=await r.json().catch(()=>null);
  if(!d){lastTrace={worker:"bad response"};return null;}
  lastTrace={worker:"answered",tried:d.tried||[],configured:d.configured||null};
  return d.found?d.result:null;
}
function traceHTML(){
  if(!lastTrace)return "";
  if(lastTrace.worker!=="answered")
    return `<div class="diag mono">Worker: ${esc(lastTrace.worker)}</div>`;
  const c=lastTrace.configured||{};
  const offList=Object.entries(c).filter(([k,v])=>v===false).map(([k])=>k);
  return `<div class="diag mono">Worker answered · tried ${esc((lastTrace.tried||[]).join(", ")||"nothing")}
    ${offList.length?`<br>No key set for: ${esc(offList.join(", "))}`:""}</div>`;
}
async function viaOBF(code){
  const r=await fetch("https://world.openbeautyfacts.org/api/v2/product/"+encodeURIComponent(code)+
    ".json?fields=product_name,product_name_en,brands,quantity,periods_after_opening,ingredients_text,image_front_small_url");
  if(r.status===404)return null;
  if(!r.ok)return null;
  const d=await r.json().catch(()=>null);
  if(!d||d.status!==1||!d.product)return null;
  const p=d.product, q=String(p.quantity||"");
  const ml=q.match(/([\d.,]+)\s*m?l\b/i), pao=String(p.periods_after_opening||"").match(/(\d+)/);
  return {name:(p.product_name_en||p.product_name||"").trim()||null,
    brand:(p.brands||"").split(",")[0].trim()||null,
    volumeMl:ml?parseFloat(ml[1].replace(",",".")):parseJpSize(q),
    paoMonths:pao?+pao[1]:null, ingredients:(p.ingredients_text||"").trim()||null,
    photo:p.image_front_small_url||null, source:"Open Beauty Facts"};
}
async function viaRakuten(code){
  if(!CFG.rakutenId)return null;
  const r=await fetch("https://app.rakuten.co.jp/services/api/IchibaItem/Search/20220601?format=json&hits=3"+
    "&applicationId="+encodeURIComponent(CFG.rakutenId)+"&keyword="+encodeURIComponent(code));
  if(!r.ok)return null;
  const d=await r.json().catch(()=>null);
  const items=((d&&d.Items)||[]).map(x=>x&&x.Item).filter(Boolean);
  if(!items.length)return null;
  const it=items.slice().sort((a,b)=>(a.itemName||"").length-(b.itemName||"").length)[0];
  const img=it.mediumImageUrls&&it.mediumImageUrls[0];
  return {name:(it.itemName||"").trim()||null,brand:null,volumeMl:parseJpSize(it.itemName),
    paoMonths:null,ingredients:null,
    photo:img?String(img.imageUrl||img).replace(/\?.*$/,""):null,source:"Rakuten"};
}
/* Which databases this device will actually query. Open Beauty Facts is
   always on but holds almost nothing Japanese or Korean, so a setup with
   nothing else configured will miss nearly every bottle on these shelves. */
function sources(){
  return [
    {name:"Open Beauty Facts", on:true,  note:"thin on JP/KR"},
    {name:"Rakuten",           on:!!CFG.rakutenId, note:"Japanese products"},
    {name:"Worker (Naver, Barcode Lookup, UPCitemdb)", on:!!CFG.workerUrl, note:"Korean + international"}
  ];
}
function sourcesHTML(){
  const list=sources();
  const off=list.filter(s=>!s.on);
  return `<div class="srcs">${list.map(s=>
    `<div class="src ${s.on?"on":"off"}"><span class="dot"></span>
      <span class="sname">${esc(s.name)}</span><span class="snote">${esc(s.note)}</span></div>`).join("")}
    </div>${off.length?`<p class="note">${off.length===2
      ? "Only Open Beauty Facts is switched on, which is why almost nothing is found. Turn on the others in Settings."
      : "One source is still switched off."}</p>
      <div class="rowbtns"><button class="btn btn-sm" data-goto="settings">Open settings</button></div>`:""}`;
}
async function lookupAny(code){
  lastTrace=null;
  const forms=[code];
  if(code.length===12)forms.push("0"+code);            // UPC-A is EAN-13 with a leading zero
  else if(code.length===13&&code[0]==="0")forms.push(code.slice(1));
  for(const fn of [viaWorker,viaOBF,viaRakuten]){
    for(const c of forms){
      try{const r=await fn(c);if(r)return r;}catch(e){}
    }
  }
  return null;
}
function applyLookup(p,r){
  if(r.volumeMl&&!p.volumeMl)p.volumeMl=r.volumeMl;
  if(r.paoMonths)p.paoMonths=r.paoMonths;
  if(r.ingredients)p.ingredients=r.ingredients;
  if(r.photo)p.photo=r.photo;
  if(r.brand&&/^New brand$/.test(p.brand))p.brand=r.brand;
  if(r.name&&/^New product$/.test(p.name))p.name=r.name;
  p.lookedUp=today();p.lookedUpVia=r.source||null;
}
async function lookupOnline(p,btn){
  if(!p.barcode)return toast("Add the barcode first, then look it up.");
  const old=btn.textContent;btn.textContent="Looking…";btn.disabled=true;
  try{
    const r=await lookupAny(p.barcode);
    if(!r)toast(CFG.workerUrl?"Not in any of the databases.":"Not found. Add your Worker in ⋯ to widen the search.");
    else{mutate(()=>applyLookup(p,r));toast("Filled in from "+(r.source||"the database")+".");}
  }catch(e){toast("Couldn't reach the database.");}
  finally{btn.textContent=old;btn.disabled=false;}
}

function closeScan(){

/* Decode barcodes out of a picture — a screenshot from another app, or a
   photo of several boxes. Same decoders as the live camera. */
async function decodeImage(file){
  const bmp=await createImageBitmap(file).catch(()=>null);
  if(!bmp)return null;
  const tries=[1,2,3];   // whole image, just more pixels per bar
  if("BarcodeDetector" in window){
    try{
      let f=["ean_13","ean_8","upc_a","upc_e"];
      try{const sup=await window.BarcodeDetector.getSupportedFormats();
        if(sup&&sup.length)f=f.filter(x=>sup.includes(x));}catch(e){}
      const det=new window.BarcodeDetector({formats:f});
      for(const k of tries){
        const src=k===1?bmp:upscale(bmp,k);
        const hits=await det.detect(src);
        const raw=hits&&hits.length&&hits[0].rawValue?String(hits[0].rawValue).replace(/\D/g,""):null;
        if(raw&&checkDigitOK(raw))return raw;
      }
    }catch(e){}
  }
  try{
    await loadScript("https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js");
    const hints=new Map(), F=window.ZXing.BarcodeFormat;
    hints.set(window.ZXing.DecodeHintType.POSSIBLE_FORMATS,
      [F.EAN_13,F.EAN_8,F.UPC_A,F.UPC_E]);
    hints.set(window.ZXing.DecodeHintType.TRY_HARDER,true);
    const reader=new window.ZXing.BrowserMultiFormatReader(hints);
    for(const k of tries){
      const cv=upscale(bmp,k);
      try{
        const res=await reader.decodeFromCanvas(cv);
        const raw=res&&res.getText()?String(res.getText()).replace(/\D/g,""):null;
        if(raw&&checkDigitOK(raw))return raw;
      }catch(e){}
    }
  }catch(e){}
  return null;
}
function upscale(bmp,k){
  const cv=document.createElement("canvas");
  const w=Math.min(2400,Math.round(bmp.width*k));
  cv.width=w;cv.height=Math.round(bmp.height*(w/bmp.width));
  cv.getContext("2d").drawImage(bmp,0,0,cv.width,cv.height);
  return cv;
}
function openImport(){
  panel("Barcodes from a photo",`
    <p class="note" style="margin:0 0 12px">Pick screenshots or photos of barcodes — one or many.
      Each is decoded and handled the same as a live scan.</p>
    <button class="btn btn-hero btn-wide" id="pickBtn">Choose pictures</button>
    <input type="file" id="pickFile" accept="image/*" multiple hidden>
    <div id="pickOut"></div>`);
  const f=document.getElementById("pickFile"), out=document.getElementById("pickOut");
  document.getElementById("pickBtn").onclick=()=>f.click();
  f.onchange=async()=>{
    const files=[...(f.files||[])];
    if(!files.length)return;
    out.innerHTML='<p class="note">Reading '+files.length+'…</p>';
    const found=[],missed=[];
    for(const file of files){
      const code=await decodeImage(file);
      if(code)found.push({code,name:file.name});else missed.push(file.name);
    }
    if(!found.length){
      out.innerHTML='<div class="ai">Nothing decoded. Crop tighter to the barcode and make sure it is '+
        'square-on and in focus.</div>';return;
    }
    // one hit: straight into the normal flow
    if(found.length===1&&!missed.length)return onCode(found[0].code);
    out.innerHTML=`<div class="srcs" style="margin-top:12px">${found.map(h=>{
      const hit=ITEMS.find(p=>p.barcode===h.code);
      return `<div class="src on"><span class="dot"></span><span class="sname mono">${esc(h.code)}</span>
        <span class="snote">${hit?esc(hit.name).slice(0,18):"new"}</span></div>`;}).join("")}</div>
      ${missed.length?`<p class="note">Couldn't read ${missed.length} of them.</p>`:""}
      <div class="rowbtns"><button class="btn btn-wide" id="nextCode">Handle these one at a time</button></div>`;
    let i=0;
    document.getElementById("nextCode").onclick=()=>{
      if(i<found.length)onCode(found[i++].code);
    };
  };
}

async function openScan(){
  panel("Scan a bottle",`<div class="cam-wrap"><video class="cam" id="cam" playsinline muted autoplay></video>
    <div class="reticle"></div>
    <button class="torch" id="torchBtn" hidden aria-label="Toggle light">💡</button></div>
    <p class="note" id="scanMsg">Starting the camera…</p>
    <div class="diag mono" id="scanDiag"></div>
    <div id="scanAlt"></div>
    <div class="rowbtns"><button class="btn btn-sm" id="fromPhoto">Read from a photo instead</button></div>
    <div id="manualSlot"></div>`);
  const fp=document.getElementById("fromPhoto");
  if(fp)fp.onclick=()=>{closeScan();openImport();};
  const msg=document.getElementById("scanMsg"), video=document.getElementById("cam"),
        diag=document.getElementById("scanDiag");
  scanState={stop:false,stream:null,reader:null,frames:0,err:"",engine:"",hits:0};

  let stream;
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{
      facingMode:{ideal:"environment"},
      width:{ideal:1920},height:{ideal:1080},
      advanced:[{focusMode:"continuous"}]
    }});
  }catch(err){
    panel("Scan a bottle",manualForm(camHelp(err)));wireManual();return;
  }
  if(!scanState){stream.getTracks().forEach(t=>t.stop());return;}
  scanState.stream=stream;
  video.srcObject=stream;
  try{await video.play();}catch(e){}
  // detection on a video with no frames yet throws every time; wait for real pixels
  if(video.readyState<2){
    await new Promise(r=>{
      const done=()=>{video.removeEventListener("loadeddata",done);r();};
      video.addEventListener("loadeddata",done);setTimeout(done,3000);
    });
  }

  const track=stream.getVideoTracks()[0];
  const caps=track.getCapabilities?track.getCapabilities():{};
  if(caps&&caps.torch){
    const tb=document.getElementById("torchBtn");
    tb.hidden=false;
    let on=false;
    tb.onclick=async()=>{on=!on;try{await track.applyConstraints({advanced:[{torch:on}]});
      tb.style.opacity=on?1:.62;}catch(e){toast("This camera won't take a light.");}};
  }

  document.getElementById("manualSlot").innerHTML=
    `<div style="margin-top:14px;padding-top:14px;border-top:1px solid var(--line)">${manualForm("Not catching it? Type the digits.")}</div>`;
  wireManual();

  const cv=document.createElement("canvas"), ctx=cv.getContext("2d",{willReadFrequently:true});
  /* Always the whole frame. Anything less risks decoding part of a barcode
     into a plausible wrong number. */
  function frame(){
    const vw=video.videoWidth, vh=video.videoHeight;
    if(!vw||!vh)return null;
    cv.width=vw;cv.height=vh;
    ctx.drawImage(video,0,0,vw,vh);
    return cv;
  }
  const tick=(fn)=>async()=>{
    if(!scanState||scanState.stop)return;
    scanState.frames++;
    try{
      const got=await fn(frame());
      if(got)return onCode(got);
    }catch(e){scanState.err=(e&&e.name||"error")+": "+(e&&e.message||"");}
    paintDiag();
    setTimeout(tick(fn),90);           // ~11 fps is plenty and keeps the phone cool
  };
  function paintDiag(){
    if(!scanState)return;
    diag.textContent=`${scanState.engine} · ${video.videoWidth}×${video.videoHeight} · `+
      `${scanState.frames} frames${scanState.err?" · "+scanState.err:""}`;
    if(scanState.frames===70)offerAlt();
  }
  function offerAlt(){
    const alt=document.getElementById("scanAlt");
    if(!alt||alt.dataset.done)return;
    alt.dataset.done="1";
    alt.innerHTML=`<div class="ai" style="margin-top:10px">Not reading it after a few seconds.
      Fill the box with the barcode, hold steady about 10–15&nbsp;cm away, and try the light if it's dim.
      <div class="rowbtns"><button class="btn btn-sm" id="altBtn">Try the other decoder</button></div></div>`;
    document.getElementById("altBtn").onclick=()=>{scanState.stop=true;setTimeout(()=>{
      if(!scanState)return;scanState.stop=false;startZXing(true);},60);};
  }

  async function startNative(){
    let f=["ean_13","ean_8","upc_a","upc_e"];
    try{const sup=await window.BarcodeDetector.getSupportedFormats();
      if(sup&&sup.length)f=f.filter(x=>sup.includes(x));}catch(e){}
    if(!f.length)throw new Error("no formats");
    const det=new window.BarcodeDetector({formats:f});
    scanState.engine="BarcodeDetector";
    msg.textContent="Hold the barcode inside the box.";
    tick(async(src)=>{
      if(!src)return null;
      const hits=await det.detect(src);
      const raw=hits&&hits.length&&hits[0].rawValue?String(hits[0].rawValue).replace(/\D/g,""):null;
      return raw&&confirmRead(raw)?raw:null;
    })();
  }
  async function startZXing(force){
    msg.textContent="Loading the decoder…";
    try{
      await loadScript("https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js");
      const hints=new Map();
      const F=window.ZXing.BarcodeFormat;
      hints.set(window.ZXing.DecodeHintType.POSSIBLE_FORMATS,
        [F.EAN_13,F.EAN_8,F.UPC_A,F.UPC_E]);
      hints.set(window.ZXing.DecodeHintType.TRY_HARDER,true);
      const reader=new window.ZXing.BrowserMultiFormatReader(hints);
      scanState.reader=reader;scanState.engine="ZXing";
      msg.textContent="Hold the barcode inside the box.";
      reader.decodeFromVideoElement(video,res=>{
        if(!res||!scanState||scanState.stop)return;
        const raw=String(res.getText()).replace(/\D/g,"");
        if(confirmRead(raw))onCode(raw);
      });
      const beat=()=>{if(!scanState||scanState.stop)return;scanState.frames++;paintDiag();setTimeout(beat,140);};
      beat();
    }catch(e){
      msg.textContent="The decoder couldn't load. Type the digits below instead.";
      if(force)toast("Couldn't load the other decoder.");
    }
  }

  if("BarcodeDetector" in window){
    try{await startNative();return;}catch(e){scanState.err="native: "+(e.message||e);}
  }
  startZXing(false);
}
function camHelp(err){
  const n=err&&err.name||"";
  if(!window.isSecureContext)return "The camera needs HTTPS. Open this page over https://.";
  if(n==="NotAllowedError")return "Camera access was refused. Tap the padlock in Chrome's address bar → Permissions → Camera → Allow, then reload.";
  if(n==="NotFoundError"||n==="OverconstrainedError")return "No camera found on this device.";
  if(n==="NotReadableError")return "Another app is using the camera. Close it and try again.";
  return "The camera didn't start. Type the digits instead.";
}
function wireManual(){
  const go=document.getElementById("mGo"), inp=document.getElementById("mIn");
  if(!go)return;
  const fire=()=>{const v=(inp.value||"").replace(/\D/g,"");
    if(v.length<6)return toast("That's too short for a barcode.");
    if(!checkDigitOK(v)&&!confirm("That doesn't match its check digit — a digit may be wrong. Use it anyway?"))return;
    readSeen="";readCount=0;onCode(v);};
  go.onclick=fire;inp.onkeydown=e=>{if(e.key==="Enter")fire();};
}
function loadScript(src){return new Promise((res,rej)=>{
  const t=document.createElement("script");t.src=src;t.onload=res;
  t.onerror=()=>rej(new Error("blocked"));document.head.appendChild(t);});}

/* Every GS1 retail barcode carries a check digit, weights alternating 3,1
   from the right. A misread almost never satisfies it. */
function checkDigitOK(code){
  const d=[...code].map(Number);
  if(d.some(Number.isNaN))return false;
  const n=d.length;
  if(n!==8&&n!==12&&n!==13)return false;
  let sum=0;
  for(let i=0;i<n-1;i++){
    const fromRight=(n-2)-i;
    sum+=d[i]*(fromRight%2===0?3:1);
  }
  return ((10-sum%10)%10)===d[n-1];
}
// A code must be read twice running before we act on it.
let readSeen="",readCount=0;
function confirmRead(code){
  if(!checkDigitOK(code)){readSeen="";readCount=0;return false;}
  if(code===readSeen)readCount++;else{readSeen=code;readCount=1;}
  return readCount>=2;
}
async function onCode(code){
  code=String(code).replace(/\D/g,"");if(!code)return;
  closeScan();
  if(navigator.vibrate)try{navigator.vibrate(40);}catch(e){}
  const hit=ITEMS.find(p=>p.barcode===code);
  if(hit){closeSheet();toast("Found it.");return openPeek(hit.id);}
  panel("Scan a bottle",`<p class="note" style="margin:0">Barcode <b class="mono">${esc(code)}</b> is new. Looking it up…</p>`);
  let found=null;
  try{found=await lookupAny(code);}catch(e){}
  bindPrompt(code,found);
}
function bindPrompt(code,found){
  const unbound=ITEMS.filter(p=>!p.barcode);
  panel("New barcode",`
    ${found?`<div class="ai" style="margin:0 0 12px"><b>${esc([found.brand,found.name].filter(Boolean).join(" — ")||"Found a record")}</b>
      ${found.volumeMl?" · "+found.volumeMl+" ml":""}${found.paoMonths?" · "+found.paoMonths+"M PAO":""}
      <div class="mono" style="font-size:9px;text-transform:uppercase;letter-spacing:.1em;margin-top:4px">via ${esc(found.source||"database")}</div></div>`
     :`<div class="ai" style="margin:0 0 4px;border-left-color:var(--good);background:var(--good-bg)">
        <b>Scanned it — ${esc(code)}</b><div style="margin-top:3px">The camera and decoder worked.
        None of the databases below hold this code.</div></div>
      ${sourcesHTML()}
      ${traceHTML()}
      <div class="field" style="margin-top:12px"><label for="fixIn">Read these digits — do they match the pack?</label>
      <input type="text" id="fixIn" class="mono" value="${esc(code)}" inputmode="numeric"></div>
    <div class="rowbtns" style="margin-top:0"><button class="btn btn-sm" id="fixGo">Use the corrected number</button></div>
    <p class="note">If a digit is off, fix it here and search again.</p>
    <div class="field" style="margin-top:14px"><label for="pasteIn">Or paste what another app found</label>
        <input type="text" id="pasteIn" placeholder="Bioré UV Aqua Rich Watery Essence 70g" autocomplete="off"></div>
      <div class="rowbtns" style="margin-top:0"><button class="btn btn-sm" id="pasteGo">Add from that</button></div>
      <p class="note">Brand and size are read out of the text. Quicker than typing the fields.</p>
      <div style="height:14px"></div>`}
    <div class="field"><label for="bindSearch">Bind it to a product you own</label>
      <input type="text" id="bindSearch" placeholder="start typing a brand or name" autocomplete="off"></div>
    <div id="bindResults" style="border:1px solid var(--line);border-radius:9px;max-height:46vh;overflow:auto"></div>
    <div class="rowbtns"><button class="btn btn-wide" id="addNew">Add as a new product</button></div>`);
  const inp=document.getElementById("bindSearch"), out=document.getElementById("bindResults");
  const draw=q=>{
    const t=q.trim().toLowerCase();
    const list=(t?unbound.filter(p=>(p.brand+" "+p.name).toLowerCase().includes(t)):unbound).slice(0,50);
    out.innerHTML=list.length?list.map(p=>`<button class="q" data-bind="${p.id}">
      <span class="nm">${esc(p.name)}<i>${esc(p.brand)}</i></span>
      <span class="why">${esc(catOf(p))}</span></button>`).join("")
      :'<p class="empty-note">Nothing matches.</p>';
  };
  draw("");inp.oninput=()=>draw(inp.value);
  out.onclick=e=>{
    const b=e.target.closest("[data-bind]");if(!b)return;
    const p=byId(b.dataset.bind);
    mutate(()=>{p.barcode=code;if(found)applyLookup(p,found);});
    closeSheet();toast("Bound to "+p.name+".");openPeek(p.id);
  };
  document.getElementById("addNew").onclick=()=>{
    const p=newProduct(found||{});p.barcode=code;
    ITEMS.unshift(p);save();closeSheet();renderAll();openSheet(p.id);
  };
  const fx=document.getElementById("fixIn"), fg=document.getElementById("fixGo");
  if(fg)fg.onclick=()=>{
    const v=(fx.value||"").replace(/\D/g,"");
    if(v.length<6)return toast("That's too short for a barcode.");
    if(v===code)return toast("That's the same number.");
    if(!checkDigitOK(v)&&!confirm("That doesn't match its check digit. Use it anyway?"))return;
    readSeen="";readCount=0;onCode(v);
  };
  const pi=document.getElementById("pasteIn"), pg=document.getElementById("pasteGo");
  if(pg){
    const go=()=>{
      const raw=(pi.value||"").trim();
      if(raw.length<3)return toast("Paste the product name first.");
      const p=newProduct(parsePasted(raw));p.barcode=code;
      ITEMS.unshift(p);save();closeSheet();renderAll();openSheet(p.id);
    };
    pg.onclick=go;pi.onkeydown=e=>{if(e.key==="Enter")go();};
  }
}

/* ===== add, settings, backup ===== */
/* A pasted listing line carries the brand first and the size last:
   "Bioré UV Aqua Rich Watery Essence 70g" */
function parsePasted(raw){
  const vol=parseJpSize(raw);
  let t=raw.replace(/\s*[\d.,]+\s*(ml|mL|ML|ｍｌ|g|ｇ|グラム|ミリ)\s*$/i,"").trim();
  t=t.replace(/^[\[【(].*?[\]】)]\s*/,"").trim();     // drop 【送料無料】 style prefixes
  const words=t.split(/\s+/);
  const brand=words.length>1?words[0]:null;
  const name=words.length>1?words.slice(1).join(" "):t;
  return {brand,name:name||t,volumeMl:vol,source:"pasted"};
}
function newProduct(seed){
  seed=seed||{};
  const d=CAT_DEFAULTS.Other;
  return {id:"n"+Date.now().toString(36)+Math.floor(Math.random()*999).toString(36),
    brand:seed.brand||"New brand", name:seed.name||"New product", category:"Other",
    container:d.container, volumeMl:seed.volumeMl||null, sheets:null,
    sealed:1, open:false, baseline:1, openedAt:null, dose:d.dose,
    paoMonths:seed.paoMonths||d.pao, activeSince:null, activeDays:0, trays:[],
    barcode:null, ingredients:seed.ingredients||null, photo:seed.photo||null,
    lookedUp:seed.source?today():null, lookedUpVia:seed.source||null, notes:null};
}

      ${sourcesHTML().replace(/<div class="rowbtns">[\s\S]*?<\/div>/,"")}

      <div class="rowbtns"><button class="btn btn-sm" id="wkTest">Save and test</button></div>

      <div class="rowbtns"><button class="btn btn-sm" id="reloadBtn">Force refresh</button></div></div>
    <div class="sec"><h4>Backup</h4>
      <p class="note" style="margin:0 0 10px">Your inventory lives in this browser only. Export before

      <input type="file" id="impFile" accept="application/json" hidden>

  const wk=document.getElementById("wkIn"), wout=document.getElementById("wkOut");
  document.getElementById("wkTest").onclick=async()=>{

    wout.innerHTML='<p class="note">Testing…</p>';

      const r=await fetch(CFG.workerUrl+"/lookup?code=5017634238483");
      const d=await r.json().catch(()=>null);
      if(!r.ok||!d)throw new Error("HTTP "+r.status);
      const cfg=d.configured||{};
      const off=Object.entries(cfg).filter(([k,v])=>v===false).map(([k])=>k);
      wout.innerHTML='<div class="ai"><b>'+(d.found?"Working.":"Reachable, but no match.")+'</b> Tried: '+
        esc((d.tried||[]).join(", ")||"nothing")+
        (d.found&&d.result?'<br>Returned “'+esc(d.result.name||"")+'”.':'')+
        (off.length?'<br><b>No key set for: '+esc(off.join(", "))+'</b> — run <span class="mono">wrangler secret put</span> for those, or they are skipped.':'')+
        '</div>';
    }catch(e){wout.innerHTML='<div class="ai">Couldn\'t reach it: <b>'+esc(e.message||"failed")+
      '</b>. Check the URL, and that your origin is in ALLOWED_ORIGINS.</div>';}

  };
  document.getElementById("expBtn").onclick=()=>{

    try{
      if("serviceWorker" in navigator){

      }
      if(window.caches){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)));}
    }catch(e){}
    location.reload(true);
  };
  document.getElementById("photoBtn").onclick=openImport;
  const f=document.getElementById("impFile");
  document.getElementById("impBtn").onclick=()=>f.click();
  f.onchange=async()=>{
    const file=f.files&&f.files[0];if(!file)return;
    try{
      const d=JSON.parse(await file.text());
      const items=Array.isArray(d)?d:d.items;
      if(!Array.isArray(items)||!items.length)throw new Error("empty");
      if(!confirm("Replace all "+ITEMS.length+" products with "+items.length+" from this file?"))return;
      ITEMS=items.map(migrate);save();closeSheet();renderAll();toast("Imported "+items.length+" products.");
    }catch(e){toast("That file isn't a Shelf Life export.");}
  };
});
